<header class="navbar-container">
  <!-- Gauche : Toggle + Logo -->
  <div class="navbar-left">
    <button class="btn-icon sidebar-toggle" (click)="onToggleSidebar()" title="Menu">
      <i class="bi bi-list"></i>
    </button>
    <div class="brand">
      <span class="brand-icon">🎬</span>
      <span class="brand-title">Cine<span class="highlight">Manager</span></span>
    </div>
  </div>

  <!-- Centre : Select Genre + Barre de recherche -->
  <div class="navbar-center-search">
    <div class="search-group">
      <!-- Select des genres dynamiques -->
      <select 
        [(ngModel)]="selectedGenreId" 
        (change)="onGenreChange()" 
        class="genre-select"
      >
        <option value="">Tous les genres</option>
        <option *ngFor="let g of genres" [value]="g.id">
          {{ g.libelle }}
        </option>
      </select>

      
      <!-- Champ de recherche -->
      <div class="search-box">
        <i class="bi bi-search search-icon" (click)="onSearch()" style="cursor: pointer;"></i>
        <input 
          type="text" 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="onSearch()"
          placeholder="Rechercher un film, une séance..." 
        />
      </div>
    </div>
  </div>

  <!-- Centre : Accueil & statut -->
  <div class="navbar-center-welcome">
    <div class="welcome-banner">
      <p class="welcome-text">
        Bonjour, <strong>{{ firstName }}</strong>
      </p>
      <span class="status-badge" aria-label="Statut du catalogue">
        <i class="bi bi-circle-fill status-dot" aria-hidden="true"></i>
        Catalogue actif
      </span>
    </div>
  </div>

  <!-- Droite : Notifications & Profil -->
  <div class="navbar-right">
    <button class="btn-icon notif-btn" title="Notifications">
      <i class="bi bi-bell"></i>
      <span *ngIf="unreadNotifications > 0" class="badge-notif">{{ unreadNotifications }}</span>
    </button>

    <div class="user-dropdown" (click)="toggleProfileMenu()">
      <div class="avatar">
        <span>{{ currentUser.name.charAt(0) }}</span>
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">{{ currentUser.role }}</span>
      </div>
      <i class="bi bi-chevron-down dropdown-icon"></i>

      <div class="dropdown-menu" [class.show]="isProfileMenuOpen">
        <a href="javascript:void(0)" class="dropdown-item"><i class="bi bi-person"></i> Mon Profil</a>
        <a href="javascript:void(0)" class="dropdown-item"><i class="bi bi-gear"></i> Paramètres</a>
        <div class="dropdown-divider"></div>
        <button (click)="logout()" class="dropdown-item logout">
          <i class="bi bi-box-arrow-right"></i> Déconnexion
        </button>
      </div>
    </div>
  </div>
</header>
