<header class="navbar-container">
  <!-- Côté Gauche : Bouton Sidebar + Marque / Logo -->
  <div class="navbar-left">
    <button class="btn-icon sidebar-toggle" (click)="onToggleSidebar()" title="Masquer / Afficher le menu">
      <i class="bi bi-list"></i>
    </button>
    
    <div class="brand">
      <span class="brand-icon">🎬</span>
      <span class="brand-title">Cine<span class="highlight">Manager</span></span>
    </div>
  </div>

  <!-- Centre : Barre de recherche globale -->
  <div class="navbar-center">
    <div class="search-box">
      <i class="bi bi-search search-icon"></i>
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        (keyup.enter)="onSearch()"
        placeholder="Rechercher un film, une séance, une salle..." 
      />
    </div>
  </div>

  <!-- Côté Droit : Notifications & Profil utilisateur -->
  <div class="navbar-right">
    <!-- Notifications -->
    <button class="btn-icon notif-btn" title="Notifications">
      <i class="bi bi-bell"></i>
      <span *ngIf="unreadNotifications > 0" class="badge-notif">{{ unreadNotifications }}</span>
    </button>

    <!-- Profil & Menu Déroulant -->
    <div class="user-dropdown" (click)="toggleProfileMenu()">
      <div class="avatar">
        <span>{{ currentUser.name.charAt(0) }}</span>
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">{{ currentUser.role }}</span>
      </div>
      <i class="bi bi-chevron-down dropdown-icon"></i>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu" [class.show]="isProfileMenuOpen">
        <a href="javascript:void(0)" class="dropdown-item">
          <i class="bi bi-person"></i> Mon Profil
        </a>
        <a href="javascript:void(0)" class="dropdown-item">
          <i class="bi bi-gear"></i> Paramètres
        </a>
        <div class="dropdown-divider"></div>
        <button (click)="logout()" class="dropdown-item logout">
          <i class="bi bi-box-arrow-right"></i> Déconnexion
        </button>
      </div>
    </div>
  </div>
</header>
